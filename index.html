<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>천국고시 1단계 · 계시록 암송 연습</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1f2937;--sub:#6b7280;--blue:#4f46e5;--light:#e0e7ff;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Pretendard",sans-serif}
.wrap{max-width:850px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 4px 16px #0000000c}
h1{font-size:25px;margin:0 0 6px}.sub{color:var(--sub);font-size:14px;margin-bottom:14px}
.toolbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px}
.tgroup{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tlabel{font-size:13px;font-weight:800;color:var(--sub)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;border-radius:0;background:#fff;padding:8px 12px;font-size:13px;color:var(--sub)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--blue);color:#fff}
#mode-desc{margin:8px 2px 0}
.tabs{display:flex;gap:8px;margin:18px 0}.tab{flex:1;border:1px solid var(--line);background:#f8fafc;border-radius:12px;padding:12px 8px;font-weight:700;cursor:pointer;color:var(--sub)}
.tab.active{background:var(--light);color:var(--blue);border-color:var(--light)}
.panel{display:none}.panel.active{display:block}
.card{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.qhead{font-weight:800;font-size:17px;margin-bottom:10px}.points{font-size:13px;color:var(--sub);font-weight:500}
.prompt{line-height:1.95;white-space:pre-wrap;margin:10px 0}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical;line-height:1.7}
.blankrow{display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button{border:1px solid var(--line);background:#f3f4f6;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
button:disabled{opacity:.45;cursor:not-allowed}
.progress{font-size:14px;color:var(--sub);margin:10px 0}
.small{font-size:13px;color:var(--sub)}.verse-ref{font-weight:800;color:var(--blue)}
.question-nav{display:flex;flex-wrap:wrap;gap:6px}.question-nav button{padding:7px 10px;font-size:13px}
.question-nav button.oknav{background:#dcfce7;color:#166534;border-color:#86efac}.question-nav button.badnav{background:#fee2e2;color:#991b1b;border-color:#fca5a5}.question-nav button.partnav{background:#fef3c7;color:#92400e;border-color:#fcd34d}.question-nav button.filled{background:#eef2ff;color:#3730a3;border-color:#c7d2fe}
.navsec{flex-basis:100%;font-size:12px;font-weight:800;color:var(--sub);margin:8px 0 2px}
.question-nav button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.hidden{display:none!important}
/* 입력 칸 */
.field{margin:12px 0}.flabel{font-size:13px;font-weight:800;color:var(--sub);margin-bottom:5px}
.field.cur .fin{border-color:var(--blue);box-shadow:0 0 0 3px #e0e7ff}
.field.ok .fin{border-color:#86efac;background:#f0fdf4}
.field.no .fin{border-color:#fca5a5;background:#fff7f7}
.fb{margin-top:7px;font-size:14px;line-height:1.75;padding:9px 11px;border-radius:10px}
.fb.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;font-weight:700}
.fb.no{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}
.fb .legend{font-size:12px;color:var(--sub);font-weight:500;margin-left:6px}
.diff{margin-top:5px;color:var(--ink);font-size:15px}
.miss{background:#fecaca;color:#991b1b;border-radius:3px;font-weight:800;padding:0 1px}
.extra{text-decoration:line-through;color:#9ca3af;background:#f3f4f6;border-radius:3px;padding:0 1px}
.legend .miss,.legend .extra{font-size:12px}
/* 지문 속 빈칸 */
